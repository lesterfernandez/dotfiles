set -g mouse on

# Vi mode
set -g mode-keys vi

# resize the pane
bind -r - if-shell -F '#{pane_at_bottom}' 'resize-pane -D 5' 'resize-pane -U 5'
bind -r + if-shell -F '#{pane_at_bottom}' 'resize-pane -U 5' 'resize-pane -D 5'
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5

# Move between panes using vim-like
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Allow passing focus state
set-option -g focus-events on

set -s copy-command 'pbcopy'

